
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emir'in Asistanı</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #030509;
      --panel: #090f19;
      --border: #19354b;
      --text: #edf7ff;
      --muted: #8799ae;
      --neon: #00eaff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { display: flex; height: 100dvh; }
    aside {
      width: 260px;
      flex-shrink: 0;
      background: #060b13;
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .brand {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--neon);
      padding: 10px 5px;
    }
    .new-chat {
      padding: 12px;
      border-radius: 12px;
      background: #0a1a29;
      border: 1px solid #15536b;
      color: white;
      text-align: left;
    }
    .new-chat:hover { border-color: var(--neon); }
    .history {
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
    }
    .history button {
      padding: 11px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: #b7c5d5;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history button:hover,
    .history button.active { background: #122437; }
    .footer {
      margin-top: auto;
      color: var(--muted);
      font-size: 12px;
    }
    main {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse at 50% 0%, #102342, transparent 55%),
        radial-gradient(#25415c 0.7px, transparent 1px);
      background-size: auto, 55px 55px;
    }
    header {
      padding: 18px 25px;
      border-bottom: 1px solid var(--border);
      background: #050911dc;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status { color: #00e6ac; font-size: 12px; }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 30px 20px 160px;
    }
    .messages { max-width: 800px; margin: auto; }
    .welcome {
      text-align: center;
      padding-top: min(16vh, 120px);
    }
    .logo {
      font-size: 52px;
      color: var(--neon);
      text-shadow: 0 0 35px #00eaff;
    }
    h1 { font-size: clamp(26px, 5vw, 38px); }
    .welcome p { color: var(--muted); }
    .suggestions {
      margin: 30px auto;
      max-width: 560px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .suggestions button {
      background: #0b1422;
      color: #cbd9e9;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: left;
    }
    .suggestions button:hover { border-color: var(--neon); }
    .message {
      display: flex;
      gap: 13px;
      margin-bottom: 25px;
    }
    .avatar {
      flex: 0 0 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #12324a;
      color: var(--neon);
      font-weight: bold;
    }
    .message.user .avatar {
      color: white;
      background: #35304c;
    }
    .content {
      min-width: 0;
      flex: 1;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.65;
    }
    .message.user .content {
      background: #101b2d;
      border: 1px solid #244059;
      border-radius: 12px;
      padding: 12px 15px;
    }
    .composer-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 35px 20px 18px;
      background: linear-gradient(transparent, #030509 30%);
    }
    .composer {
      max-width: 800px;
      margin: auto;
      background: #0a111e;
      border: 1px solid #17506a;
      border-radius: 17px;
      padding: 12px;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      box-shadow: 0 0 25px #00eaff12;
    }
    .composer:focus-within { border-color: var(--neon); }
    textarea {
      flex: 1;
      min-width: 0;
      max-height: 160px;
      resize: none;
      background: transparent;
      color: white;
      border: none;
      outline: none;
      padding: 8px;
    }
    .send {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #00eaff, #8b5cf6);
      color: #02050a;
      font-size: 22px;
      font-weight: bold;
    }
    .send:disabled { opacity: .45; cursor: wait; }
    .notice {
      color: #71849a;
      text-align: center;
      font-size: 11px;
      margin-top: 12px;
    }
    @media (max-width: 700px) {
      aside { width: 180px; }
      .brand { font-size: 13px; }
      .suggestions { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      aside { display: none; }
      header { padding: 15px; }
      .chat { padding: 20px 12px 145px; }
      .composer-area { padding: 20px 10px 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">✦ EMİR'İN ASİSTANI</div>
      <button class="new-chat" id="newChat">＋ Yeni sohbet</button>
      <div class="history" id="history"></div>
      <div class="footer">Puter.js ile desteklenir</div>
    </aside>

    <main>
      <header>
        <strong>✦ Emir'in Asistanı</strong>
        <span class="status" id="status">Hazır</span>
      </header>

      <section class="chat" id="chat">
        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-area">
        <div class="composer">
          <textarea id="prompt" rows="1"
            placeholder="Emir'in Asistanı'na mesaj yaz..."></textarea>
          <button class="send" id="send">↑</button>
        </div>
        <div class="notice">
          Yapay zekâ hata yapabilir. Önemli bilgileri doğrula.
        </div>
      </div>
    </main>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const KEY = "emirin-asistani-sohbetler-v1";

    let chats = [];
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
      chats = Array.isArray(saved) ? saved : [];
    } catch {
      chats = [];
    }

    let activeId = null;
    let busy = false;

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(chats));
      } catch (error) {
        console.warn("Sohbet kaydedilemedi:", error);
      }
      renderHistory();
    }

    function current() {
      return chats.find(c => c.id === activeId);
    }

    function newChat() {
      const chat = {
        id: crypto.randomUUID
          ? crypto.randomUUID()
          : String(Date.now()),
        title: "Yeni sohbet",
        messages: []
      };
      chats.unshift(chat);
      activeId = chat.id;
      save();
      renderMessages();
      $("prompt").focus();
    }

    function renderHistory() {
      const box = $("history");
      box.replaceChildren();

      chats.forEach(chat => {
        const button = document.createElement("button");
        button.textContent = chat.title;
        button.className = chat.id === activeId ? "active" : "";
        button.onclick = () => {
          activeId = chat.id;
          renderHistory();
          renderMessages();
        };
        box.appendChild(button);
      });
    }

    function renderMessages() {
      const box = $("messages");
      box.replaceChildren();
      const chat = current();

      if (!chat || !chat.messages.length) {
        box.innerHTML = `
          <div class="welcome">
            <div class="logo">✦</div>
            <h1>EMİR'İN ASİSTANI</h1>
            <p>Your Personal AI Universe</p>
            <div class="suggestions">
              <button>Bana bir şey öğret</button>
              <button>Yaratıcı fikirler üret</button>
              <button>Kod yazmama yardım et</button>
              <button>Bir konuyu açıkla</button>
            </div>
          </div>
        `;

        box.querySelectorAll(".suggestions button")
          .forEach(button => {
            button.onclick = () => {
              $("prompt").value = button.textContent;
              sendMessage();
            };
          });
        return;
      }

      chat.messages.forEach(message => {
        addMessage(message.role, message.content);
      });
      scrollBottom();
    }

    function addMessage(role, content) {
      const wrapper = document.createElement("div");
      wrapper.className = "message " + role;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "S" : "✦";

      const body = document.createElement("div");
      body.className = "content";
      body.textContent = content;

      wrapper.append(avatar, body);
      $("messages").appendChild(wrapper);
      return body;
    }

    function scrollBottom() {
      const chat = $("chat");
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      if (busy) return;

      const prompt = $("prompt").value.trim();
      if (!prompt) return;

      if (!current()) newChat();

      const chat = current();
      chat.messages.push({ role: "user", content: prompt });

      if (chat.title === "Yeni sohbet") {
        chat.title = prompt.slice(0, 35);
      }

      $("prompt").value = "";
      save();
      renderMessages();

      busy = true;
      $("send").disabled = true;
      $("status").textContent = "Düşünüyor...";

      const responseBody = addMessage("assistant", "Yanıt hazırlanıyor...");
      let answer = "";

      try {
        if (!window.puter || !puter.ai) {
          throw new Error("Puter.js yüklenemedi.");
        }

        const history = chat.messages
          .filter(m => m.role === "user" || m.role === "assistant")
          .map(m => ({
            role: m.role,
            content: m.content
          }));

        const response = await puter.ai.chat(history, {
          model: "gpt-5-nano"
        });

        if (typeof response === "string") {
          answer = response;
        } else if (response?.message?.content) {
          const content = response.message.content;
          answer = typeof content === "string"
            ? content
            : Array.isArray(content)
              ? content.map(item => item.text || "").join("")
              : "";
        } else if (response?.text) {
          answer = response.text;
        }

        if (!answer) {
          throw new Error("Yapay zekâ boş yanıt döndürdü.");
        }

        responseBody.textContent = answer;
        chat.messages.push({
          role: "assistant",
          content: answer
        });
        save();

      } catch (error) {
        const message = "Hata: " + (error.message || String(error));
        responseBody.textContent = message;
        console.error(error);
      } finally {
        busy = false;
        $("send").disabled = false;
        $("status").textContent = "Hazır";
        scrollBottom();
        $("prompt").focus();
      }
    }

    $("send").addEventListener("click", sendMessage);

    $("prompt").addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    $("prompt").addEventListener("input", () => {
      const textarea = $("prompt");
      textarea.style.height = "auto";
      textarea.style.height =
        Math.min(textarea.scrollHeight, 160) + "px";
    });

    $("newChat").addEventListener("click", newChat);

    if (chats.length) {
      activeId = chats[0].id;
      renderHistory();
      renderMessages();
    } else {
      newChat();
    }
  </script>
</body>
</html>
